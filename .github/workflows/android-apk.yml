# Build APK Android su GitHub Actions.
# Avvio SOLO MANUALE (Actions → "Android APK" → Run workflow): nessuna esecuzione
# automatica, per non consumare minuti senza decisione esplicita (vedi COSTS.md).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      routing_url:
        description: "URL del server Valhalla (es. http://192.168.1.10:8002/). Vuoto = non configurato"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # richiesto da maplibre_gl (source release 21)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Test core
        working-directory: packages/scooter_core
        run: dart pub get && dart analyze && dart test -x integration
      - name: Test app
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Build APK (debug-signed, solo per test)
        working-directory: app
        env:
          ROUTING_URL: ${{ inputs.routing_url }}
        run: |
          # HTTP in chiaro solo se l'URL del server lo richiede (server di sviluppo in LAN)
          if [[ "$ROUTING_URL" == http://* ]]; then export ALLOW_CLEARTEXT=true; fi
          flutter build apk --release --dart-define=ROUTING_URL="$ROUTING_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: navigatore-scooter-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
